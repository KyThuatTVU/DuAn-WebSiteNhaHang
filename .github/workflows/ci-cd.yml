name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job kiểm tra code quality và security
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Security Check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd backend
        npm ci
        
    - name: Run ESLint (nếu có)
      run: |
        cd backend
        if [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
          npx eslint . --ext .js
        else
          echo "ESLint config not found, skipping..."
        fi
      continue-on-error: true
      
    - name: Security audit
      run: |
        cd backend
        npm audit --audit-level moderate
      continue-on-error: true

  # Job test backend
  test-backend:
    runs-on: ubuntu-latest
    name: Backend Tests
    needs: code-quality
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: test_nha_hang
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd backend
        npm ci
        
    - name: Wait for MySQL
      run: |
        while ! mysqladmin ping -h"127.0.0.1" -P3306 -uroot -ptestpassword --silent; do
          sleep 1
        done
        
    - name: Setup test database
      run: |
        mysql -h127.0.0.1 -P3306 -uroot -ptestpassword -e "CREATE DATABASE IF NOT EXISTS test_nha_hang;"
        if [ -f QuanLyDBWeb/CNPM_QuanLyNhaHang.sql ]; then
          mysql -h127.0.0.1 -P3306 -uroot -ptestpassword test_nha_hang < QuanLyDBWeb/CNPM_QuanLyNhaHang.sql
        fi
        
    - name: Run tests
      env:
        NODE_ENV: test
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USER: root
        DB_PASSWORD: testpassword
        DB_NAME: test_nha_hang
      run: |
        cd backend
        npm test
      continue-on-error: true

  # Job build và deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    needs: [code-quality, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci --only=production
        
    - name: Create deployment package
      run: |
        mkdir -p deploy
        cp -r backend deploy/
        cp -r frontend deploy/
        cp -r QuanLyDBWeb deploy/
        cp README.md deploy/
        
    - name: Archive deployment package
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: deploy/
        retention-days: 30
        
    # Uncomment và cấu hình khi có server deployment
    # - name: Deploy to server
    #   uses: appleboy/ssh-action@v1.0.0
    #   with:
    #     host: ${{ secrets.HOST }}
    #     username: ${{ secrets.USERNAME }}
    #     key: ${{ secrets.SSH_KEY }}
    #     port: ${{ secrets.PORT }}
    #     script: |
    #       cd /path/to/your/app
    #       git pull origin main
    #       cd backend
    #       npm install --only=production
    #       pm2 restart your-app-name

  # Job notification
  notify:
    runs-on: ubuntu-latest
    name: Notification
    needs: [build-and-deploy]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.build-and-deploy.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        
    - name: Notify failure
      if: needs.build-and-deploy.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
