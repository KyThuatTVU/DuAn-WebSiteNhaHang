version: '3.8'

# Development Docker Compose Configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Database service (same as production)
  database:
    environment:
      MYSQL_ROOT_PASSWORD: TVU@842004
      MYSQL_DATABASE: QuanLyNhaHang
      MYSQL_USER: root
      MYSQL_PASSWORD: TVU@842004
    ports:
      - "3307:3306"  # Different port for development
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./QuanLyDBWeb/CNPM_QuanLyNhaHang.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro

  # Backend development service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: TVU@842004
      DB_NAME: QuanLyNhaHang
      JWT_SECRET: dev-jwt-secret-key-not-for-production
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
      - "9229:9229"  # Node.js debugger port
    volumes:
      - ./backend:/app/backend:cached
      - backend_dev_images:/app/backend/images
      - backend_dev_logs:/app/backend/logs
      - /app/backend/node_modules  # Anonymous volume for node_modules
    command: npm run dev
    stdin_open: true
    tty: true

  # Frontend development service
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:cached
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # Redis for development
  redis:
    ports:
      - "6380:6379"  # Different port for development
    volumes:
      - redis_dev_data:/data

  # Development tools
  adminer:
    image: adminer:latest
    container_name: nha-hang-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    networks:
      - nha-hang-network
    depends_on:
      - database

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nha-hang-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - nha-hang-network
    depends_on:
      - redis

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nha-hang-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - nha-hang-network

# Development volumes
volumes:
  mysql_dev_data:
    driver: local
  backend_dev_images:
    driver: local
  backend_dev_logs:
    driver: local
  redis_dev_data:
    driver: local
