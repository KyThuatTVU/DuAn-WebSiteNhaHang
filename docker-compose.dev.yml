version: '3.8'

services:
  # MySQL Database (same as production)
  database:
    image: mysql:8.0
    container_name: nha-hang-database-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-TVU@842004}
      MYSQL_DATABASE: ${DB_NAME:-QuanLyNhaHang}
      MYSQL_USER: ${DB_USER:-nhahang_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nhahang_password}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./QuanLyDBWeb/00-create-database.sql:/docker-entrypoint-initdb.d/00-create-database.sql:ro
      - ./QuanLyDBWeb/init.sql:/docker-entrypoint-initdb.d/01-init-data.sql:ro
    networks:
      - nha-hang-network-dev
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API (Development mode with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nha-hang-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-QuanLyNhaHang}
      DB_USER: ${DB_USER:-nhahang_user}
      DB_PASSWORD: ${DB_PASSWORD:-nhahang_password}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_images_dev:/app/images
      - backend_logs_dev:/app/logs
    networks:
      - nha-hang-network-dev
    depends_on:
      database:
        condition: service_healthy

  # Frontend Web Server (Development mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nha-hang-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - nha-hang-network-dev
    depends_on:
      - backend

  # phpMyAdmin for database management (Development only)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: nha-hang-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-nhahang_user}
      PMA_PASSWORD: ${DB_PASSWORD:-nhahang_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-TVU@842004}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - nha-hang-network-dev
    depends_on:
      database:
        condition: service_healthy

networks:
  nha-hang-network-dev:
    driver: bridge

volumes:
  mysql_data_dev:
    driver: local
  backend_images_dev:
    driver: local
  backend_logs_dev:
    driver: local
